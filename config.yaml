# =============================================================================
#  BotRecolte : configuration
#  Toutes les coordonnées d'écran sont en POINTS macOS (celles de pyautogui),
#  pas en pixels Retina. La conversion est gérée par `ecran.echelle`.
# =============================================================================

# --- Raccourcis clavier (pynput) ---------------------------------------------
# Une lettre ("n"), une touche spéciale ("f8", "f9", "esc", "space"...).
# Sur Mac, les touches F peuvent être prises par le système : utilisez fn+F8
# ou des lettres.
raccourcis:
  scanner: "n"          # lance un scan + récolte (ou un scan de test en mode test)
  pause: "p"            # pause / reprise
  arret_urgence: "w"    # arrêt immédiat de l'action en cours
  quitter_sur_urgence: false   # true : l'arrêt d'urgence ferme aussi le programme
  # Captures d'apprentissage sous le curseur (souris au repos ou bot en pause).
  # Dofus reçoit aussi la touche : Maj évite de déclencher un raccourci du jeu.
  capture_mure: "shift+o"       # céréale MÛRE sous le curseur
  capture_epuisee: "shift+e"    # céréale ÉPUISÉE (ou fausse détection) sous le curseur

# --- Écran / capture ---------------------------------------------------------
ecran:
  # Facteur pixels physiques / points. "auto" = mesuré à la capture
  # (2.0 sur un écran Retina). Forcer une valeur si la calibration l'exige.
  echelle: auto
  # Zone de jeu à analyser, en points. MacBook Air/Pro M1 13" = 1440x900 points
  # par défaut. On exclut la barre d'interface du bas (sorts, chat...).
  zone_jeu: {left: 0, top: 0, width: 1440, height: 760}
  # Rectangles à ignorer dans la zone de jeu (points) : minimap, boutons, etc.
  zones_exclues:
    - {left: 0, top: 0, width: 260, height: 60}      # bandeau haut gauche (à ajuster)
    # - {left: 1300, top: 0, width: 140, height: 140}

# --- Fenêtre / sécurité ------------------------------------------------------
securite:
  # Nom (ou partie du nom) de l'application au premier plan autorisée.
  applications_autorisees: ["Dofus"]
  verifier_premier_plan: true
  # Nombre maximal de candidats d'affilée sans infobulle lisible avant arrêt.
  max_introuvables_consecutifs: 4
  # Nombre maximal de passes de vérification par carte avant arrêt.
  max_passes_par_carte: 4
  # Vérifier les alertes (combat, inventaire plein...) avant chaque clic.
  alertes_avant_chaque_clic: true
  # Durée (s) pendant laquelle « Dofus au premier plan » est considéré acquis
  # (osascript coûte 50-100 ms ; installez pyobjc-framework-Cocoa pour plus rapide).
  cache_premier_plan: 0.7
  # Seuil du template matching pour les images de assets/alertes/.
  seuil_alerte: 0.85
  # Ctrl+coin haut gauche de l'écran = arrêt de pyautogui (sécurité native).
  failsafe_coin_ecran: true

# --- Détection ---------------------------------------------------------------
detection:
  detecteur: hsv_template        # module interchangeable (voir vision.py)
  # MÉTHODE PRINCIPALE : template matching sur vos images de
  # assets/cereales/<id>/mure/. La couleur ne sert qu'en secours.
  # Résolution de la capture de vos images de assets/ (pixels par point) :
  # 2.0 = capture Retina (Cmd+Maj+4 ou captures du mode test), 1.0 sinon.
  echelle_images_assets: 2.0
  # Résolution de travail de la détection (pixels par point). 1.0 = rapide ;
  # 2.0 = pleine résolution Retina (plus précis, ~4x plus lent).
  resolution_travail: 1.0
  # Passe grossière sur une image réduite (fraction de la résolution de
  # travail) puis vérification fine autour des zones trouvées. 0 = désactivée.
  resolution_grossiere: 0.5
  marge_grossiere: 0.12          # seuil de la passe grossière = seuil - marge
  # Apprentissage de la taille : après quelques détections, seules les 2
  # tailles où vos images sont trouvées sont testées (mémoire dans
  # apprentissage/memoire_echelles.json). Recherche complète régulière.
  apprendre_echelles: true
  hits_pour_apprendre: 5
  recherche_complete_tous_les: 10
  threads: 0                     # 0 = automatique (cœurs du processeur)
  # Surface d'un candidat (en points², convertie en pixels selon l'échelle).
  aire_min: 120
  aire_max: 6000
  # Rapport hauteur/largeur accepté pour un contour (les épis sont hauts).
  ratio_min: 0.4
  ratio_max: 4.0
  # Noyau morphologique (pixels physiques) pour nettoyer le masque.
  noyau_morpho: 5
  # Seuil de template matching (TM_CCOEFF_NORMED, 0..1) pour les images mûres.
  # Trop de faux positifs -> montez (0.75) ; rien de trouvé -> baissez (0.6).
  # Le diagnostic (mode test / analyser) affiche le meilleur score de chaque image.
  seuil_template: 0.68
  # Tailles relatives testées (zoom du jeu légèrement différent de vos captures).
  echelles_template: [0.8, 0.9, 1.0, 1.1, 1.25]
  # Si une image "épuisée" correspond mieux que "mûre" + marge -> rejet.
  marge_epuisee: 0.05
  # Distance (points) sous laquelle deux candidats sont fusionnés.
  distance_fusion: 25
  # Garder aussi les candidats trouvés uniquement par la couleur alors que la
  # céréale a des images : déconseillé (l'herbe a souvent la même teinte).
  garder_couleur_seule: false
  bonus_couleur: true            # petit bonus de score si la couleur confirme
  # Céréale sélectionnée SANS image dans mure/ : false = ignorée ;
  # true = détection par couleur seule (beaucoup de faux candidats).
  couleur_si_pas_d_image: false

# --- Céréales ----------------------------------------------------------------
# Plages HSV OpenCV (H: 0-180, S: 0-255, V: 0-255). Plusieurs plages possibles.
# `calibre: false` = valeurs estimées, à affiner avec `python main.py hsv`.
# Blé et orge sont estimés à partir des icônes fournies ; à confirmer en jeu.
cereales:
  ble:        {nom: "Blé",        calibre: false, hsv: [[[16, 110, 140], [28, 255, 255]]]}
  orge:       {nom: "Orge",       calibre: false, hsv: [[[22, 100, 120], [35, 200, 240]]]}   # d'après la capture en jeu
  avoine:     {nom: "Avoine",     calibre: false, hsv: [[[18, 60, 130], [30, 190, 255]]]}
  houblon:    {nom: "Houblon",    calibre: false, hsv: [[[38, 80, 90], [60, 255, 255]]]}
  lin:        {nom: "Lin",        calibre: false, hsv: [[[95, 60, 110], [125, 255, 255]]]}
  seigle:     {nom: "Seigle",     calibre: false, hsv: [[[10, 70, 100], [20, 220, 230]]]}
  riz:        {nom: "Riz",        calibre: false, hsv: [[[20, 30, 160], [35, 140, 255]]]}
  malt:       {nom: "Malt",       calibre: false, hsv: [[[12, 100, 110], [22, 255, 230]]]}
  chanvre:    {nom: "Chanvre",    calibre: false, hsv: [[[40, 70, 70], [75, 255, 220]]]}
  mais:       {nom: "Maïs",       calibre: false, hsv: [[[22, 140, 170], [32, 255, 255]]]}
  millet:     {nom: "Millet",     calibre: false, hsv: [[[15, 80, 120], [26, 220, 240]]]}
  frostiflax: {nom: "Frostiflax", calibre: false, hsv: [[[85, 40, 150], [110, 200, 255]]]}
  quisnoa:    {nom: "Quisnoa",    calibre: false, hsv: [[[0, 80, 110], [10, 255, 255]]]}

# --- Infobulle (validation au survol) ----------------------------------------
infobulle:
  # Règle de clic :
  #   exigee        : clic seulement si « Faucher » est lu dans l'infobulle ;
  #   si_disponible : « Faucher » lu, OU infobulle illisible mais image très
  #                   ressemblante (score >= score_min_sans_infobulle) ;
  #   desactivee    : clic sur tout candidat trouvé par image, sans lecture.
  # « Épuisé » lu = jamais de clic, quelle que soit la règle.
  validation: si_disponible
  score_min_sans_infobulle: 0.80
  # Clic DIRECT, sans survol ni lecture de l'infobulle, si la céréale
  # ressemble très fortement à vos images (1er passage seulement). 1.1 = jamais.
  score_clic_direct: 0.85
  # L'infobulle est guettée : lecture toutes les `intervalle_lecture` s après
  # `delai_min`, jusqu'à `delai_max`. Avec apprendre_delai, l'attente max est
  # ramenée au délai réellement mesuré sur votre Mac (+ marge).
  delai_min: 0.06
  delai_max: 0.6
  intervalle_lecture: 0.04
  apprendre_delai: true
  essais: 1                     # nouveaux survols si l'infobulle reste illisible
  # Zone de recherche autour du curseur (points, relatif au curseur).
  zone: {dx: -220, dy: -160, width: 440, height: 320}
  seuil_template: 0.75
  echelles: [0.8, 0.9, 1.0, 1.1, 1.25]
  ocr_secours: true             # utilise pytesseract s'il est installé
  mots_faucher: ["faucher"]
  mots_epuisee: ["épuisée", "epuisee", "épuisé", "epuise"]

# --- Surbrillance / fin de file ----------------------------------------------
file_attente:
  seuil_surbrillance: 0.78      # template matching assets/surbrillance/
  # Plage HSV optionnelle de la surbrillance (null = désactivée).
  hsv_surbrillance: null        # ex. [[[0, 0, 240], [180, 40, 255]]]
  attente_demarrage: 1.0        # s avant la 1re vérification (le personnage démarre)
  intervalle_verif: 1.2         # secondes entre deux vérifications
  verifs_confirmation: 2        # vérifs consécutives sans surbrillance = fini
  timeout: 180                  # secondes max d'attente de la file
  # Repli si aucune image/plage de surbrillance n'est fournie : on attend que
  # l'image soit stable (le personnage ne bouge plus) pendant X secondes.
  repli_stabilite_secondes: 4.0
  repli_seuil_mouvement: 0.004  # fraction de pixels qui changent
  # Rayon (points) autour d'une surbrillance pour ignorer un candidat.
  rayon_ignorer: 30

# --- Souris humaine ----------------------------------------------------------
souris:
  vitesse: 1.0                  # multiplicateur global (>1 = plus rapide)
  duree_min: 0.09               # durée min d'un déplacement (s)
  duree_max: 0.45               # durée max d'un déplacement (s)
  duree_par_1000px: 0.22        # durée additionnelle par 1000 points
  courbure: 0.22                # amplitude des points de contrôle de Bézier
  bruit: 1.2                    # bruit (points) ajouté le long du trajet
  proba_depassement: 0.18       # probabilité de dépasser légèrement la cible
  depassement_max: 9            # amplitude max du dépassement (points)
  pas_par_seconde: 120          # fréquence des positions intermédiaires
  # Point de clic : décalage aléatoire dans la boîte de la ressource,
  # en fraction de sa demi-taille (jamais le centre exact).
  zone_clic: 0.45
  appui_min: 0.04               # durée d'appui du clic (s)
  appui_max: 0.10

# --- Délais entre actions ----------------------------------------------------
# Distribution log-normale : médiane + dispersion (sigma), bornée.
delais:
  # Valeurs rapides mais toujours variables (côté humain). Pour ralentir,
  # augmentez les médianes.
  entre_clics: {mediane: 0.11, sigma: 0.5, min: 0.04, max: 0.6}
  apres_survol: {mediane: 0.04, sigma: 0.5, min: 0.01, max: 0.2}
  # Petites pauses irrégulières (probabilité par action).
  proba_micro_pause: 0.03
  micro_pause: {mediane: 0.6, sigma: 0.5, min: 0.25, max: 1.8}

# --- Apprentissage (Maj+O / Maj+E et collecte auto) --------------------------
apprentissage:
  dossier: "apprentissage"
  # Taille de l'extrait enregistré autour du curseur (points) : environ un
  # plant. Vos images d'orge font ~50x60 points.
  extrait: {largeur: 50, hauteur: 60}
  # Après Maj+O/E, écartez la souris : la céréale est recapturée sans
  # surbrillance ni infobulle (telle que le scan la voit).
  attendre_souris_ecartee: 4.0  # s max
  distance_ecart: 80            # points
  delai_apres_ecart: 0.35       # s (le temps que l'infobulle disparaisse)
  # Collecte auto : céréales confirmées par l'infobulle pendant la récolte.
  collecte_auto: true
  max_auto_par_carte: 8
  max_fichiers_auto: 3000
  format_carte: jpg             # cartes entières : jpg (léger) ou png
  qualite_jpg: 92
  reutiliser_carte_secondes: 30 # même carte = un seul fichier

# --- Sons (macOS afplay) -----------------------------------------------------
sons:
  actif: true
  fin_carte: "/System/Library/Sounds/Glass.aiff"
  erreur: "/System/Library/Sounds/Basso.aiff"
  arret: "/System/Library/Sounds/Sosumi.aiff"
  pause: "/System/Library/Sounds/Pop.aiff"
  info: "/System/Library/Sounds/Tink.aiff"

# --- Debug / phase de test ---------------------------------------------------
debug:
  # true : le bot ne clique jamais, il détecte et enregistre des captures
  # annotées (équivalent au mode "Test détection" de l'interface).
  actif: false
  dossier: "debug"
  survol_en_test: true          # en test : survole les candidats pour lire l'infobulle (sans clic)
  enregistrer_extraits: true    # enregistre chaque candidat découpé (pour créer des templates)
  taille_extrait: 90            # côté de l'extrait en points
